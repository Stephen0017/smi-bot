name: Telegram video bot

on:
  schedule:
    - cron: "2-57/5 * * * *"
  workflow_dispatch:

concurrency:
  group: telegram-video-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  poll-and-render:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      API_ID: ${{ secrets.API_ID }}
      API_HASH: ${{ secrets.API_HASH }}
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      OWNER_CHAT_ID: ${{ secrets.OWNER_CHAT_ID }}
      CHANNELS: ${{ secrets.CHANNELS }}
      USER_SESSION_STRING: ${{ secrets.USER_SESSION_STRING }}
      BOT_SESSION_STRING: ${{ secrets.BOT_SESSION_STRING }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      MAX_POSTS_PER_RUN: "10"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out the bot and saved post cursors
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg

      - name: Install bot packages
        run: python -m pip install -r requirements.txt

      - name: Poll channels, render new posts, and send videos
        run: python bot.py --poll-once

      - name: Save channel cursors
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workflow_state.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Telegram bot channel cursors"
            git push
          fi
